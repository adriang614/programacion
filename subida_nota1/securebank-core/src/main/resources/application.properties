# Base de datos
db.url=jdbc:postgresql://localhost:5432/securebank_core
db.user=securebank_admin
db.password=Sb@nk2024
db.driver=org.postgresql.Driver

# Pool de conexiones (implementación propia)
db.pool.min=2
db.pool.max=10
